name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.dart')
          if (( ${#files[@]} > 0 )); then
            dart format "${files[@]}"
            git diff --exit-code -- "${files[@]}"
          fi
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-android-release:
    name: Build signed Android release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Decode existing release signing keystore
        shell: bash
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY_STORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name; signed APK builds require all release signing secrets."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_KEY_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Build signed release APKs
        shell: bash
        env:
          SIGNING_KEY_STORE_PATH: ${{ runner.temp }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/danbooru-viewer-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/danbooru-viewer-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/danbooru-viewer-android-x86_64.apk

      - name: Verify signing identity and upgrade version
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK build tools unavailable."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || -z "$aapt" ]]; then
            echo "::error::Android signing or package inspection tools unavailable."
            exit 1
          fi
          reference="$RUNNER_TEMP/published-arm64.apk"
          curl --fail --location --silent --show-error --retry 3 --output "$reference" \
            "https://github.com/${{ github.repository }}/releases/latest/download/danbooru-viewer-android-arm64-v8a.apk"
          signer_digest() {
            "$apksigner" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          version_code() {
            "$aapt" dump badging "$1" |
              sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1
          }
          reference_signer="$(signer_digest "$reference")"
          if [[ -z "$reference_signer" ]]; then
            echo "::error::Cannot read the published release signer."
            exit 1
          fi
          for apk in release/*.apk; do
            actual_signer="$(signer_digest "$apk")"
            if [[ "$actual_signer" != "$reference_signer" ]]; then
              echo "::error::$(basename "$apk") is not signed with the published release certificate."
              exit 1
            fi
          done
          old_code="$(version_code "$reference")"
          new_code="$(version_code release/danbooru-viewer-android-arm64-v8a.apk)"
          if [[ -z "$old_code" || -z "$new_code" ]] || (( new_code <= old_code )); then
            echo "::error::Android versionCode must exceed the latest published arm64 APK."
            exit 1
          fi
          echo "Release certificate matches the published APK; arm64 versionCode: $old_code -> $new_code."

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-signed
          path: release/*.apk
          if-no-files-found: error
          retention-days: 5

  build-web-release:
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          retention-days: 5
