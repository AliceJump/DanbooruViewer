name: Build Release
run-name: ${{ github.ref_name }}

on:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"
  # Git refs created through the API reliably emit create events.
  create:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  prepare:
    name: Verify release source
    # Branch creation uses create; push handles later branch updates and tags.
    # Ignore unrelated creates, branch deletion and duplicate creation pushes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'release/v')) ||
      (github.event_name == 'push' && !github.event.deleted &&
       (startsWith(github.ref, 'refs/tags/v') ||
        (startsWith(github.ref, 'refs/heads/release/v') && !github.event.created)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      tag_exists: ${{ steps.verify.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test release validation
        run: python -m unittest discover -s tests -p 'test_prepare_release.py'
      - name: Verify version, master ancestry, CI and existing release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_release.py

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest

          - target: linux
            os: ubuntu-latest

          - target: web
            os: ubuntu-latest

          - target: ios
            os: macos-latest

          - target: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build completion search assets
        run: python scripts/build_completion_index.py

      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      # 🔍 调试信息
      - name: Debug - Print cache info
        shell: bash
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Flutter Version: ${{ env.FLUTTER_VERSION }}"
          echo "pubspec.lock exists: $(test -f pubspec.lock && echo 'YES' || echo 'NO')"
          echo "pubspec.lock hash: ${{ hashFiles('**/pubspec.lock') }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true  # 这个已经缓存了 Flutter SDK

      # Pub 缓存（移除 Flutter SDK 缓存，因为上面已经处理）
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Select Android JDK
        if: matrix.target == 'android'
        run: flutter config --jdk-dir "$JAVA_HOME"

      # ---------------- ANDROID ----------------
      - name: Cache Gradle
        if: matrix.target == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Android signing keystore
        if: matrix.target == 'android'
        shell: bash
        run: |
          if [ -z "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" ] || [ -z "${{ secrets.SIGNING_STORE_PASSWORD }}" ] || [ -z "${{ secrets.SIGNING_KEY_ALIAS }}" ] || [ -z "${{ secrets.SIGNING_KEY_PASSWORD }}" ]; then
            echo "Android signing secrets are required for release builds."
            exit 1
          fi
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "SIGNING_KEY_STORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/danbooru-viewer-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/danbooru-viewer-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/danbooru-viewer-android-x86_64.apk

      - name: Upload Android
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*.apk
          if-no-files-found: error

      # ---------------- LINUX ----------------
      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          tar -czf danbooru-viewer-linux-release.tar.gz \
            -C build/linux/x64/release/bundle .

      - name: Upload Linux
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: danbooru-viewer-linux-release.tar.gz
          if-no-files-found: error

      # ---------------- WEB ----------------
      - name: Build Web
        if: matrix.target == 'web'
        run: |
          flutter build web --release
          tar -czf danbooru-viewer-web-release.tar.gz -C build web

      - name: Upload Web
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: danbooru-viewer-web-release.tar.gz
          if-no-files-found: error

      # ---------------- IOS ----------------
      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      - name: Upload iOS
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: app.ipa
          if-no-files-found: error

      # ---------------- WINDOWS ----------------
      - name: Build Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'build/windows/x64/runner/Release')) {
            throw 'Windows release output directory was not created.'
          }
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath danbooru-viewer-windows-release.zip `
            -Force

      - name: Upload Windows
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: danbooru-viewer-windows-release.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    concurrency:
      group: danbooru-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["RELEASE_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tags = subprocess.check_output(
              ["git", "tag", "--merged", sha, "--sort=-version:refname", "-l", "v*"], text=True
          ).splitlines()
          previous = next((item for item in tags if item != tag), None)
          # The new tag may not exist yet; always use the validated commit SHA.
          revision = f"{previous}..{sha}" if previous else sha
          commits = subprocess.check_output(
              ["git", "log", revision, "--oneline", "--no-decorate", "--no-merges"], text=True
          ).splitlines()
          commits = [line for line in commits if "Bump version to" not in line and "update download stats" not in line]
          rows = [f"## 变更日志 ({tag})", "", f"构建提交：`{sha}`", ""]
          if previous:
              rows.extend([f"从 {previous} 到 {tag}：", ""])
          rows.extend(commits or ["本次发布更新构建产物。"])
          rows.extend(["", "## 下载说明", "", "| 平台 | 文件 | 说明 |", "| --- | --- | --- |"])
          downloads = [
              ("Android ARM64", "danbooru-viewer-android-arm64-v8a.apk", "大多数现代 Android 手机和平板"),
              ("Android ARMv7", "danbooru-viewer-android-armeabi-v7a.apk", "较旧的 32 位 Android 设备"),
              ("Android x86_64", "danbooru-viewer-android-x86_64.apk", "Android 模拟器或 x86_64 设备"),
              ("Windows", "danbooru-viewer-windows-release.zip", "解压后运行 danbooru_viewer.exe"),
              ("Linux", "danbooru-viewer-linux-release.tar.gz", "解压后运行应用程序"),
              ("iOS", "app.ipa", "未签名 IPA，需要自行签名或侧载"),
              ("Web", "danbooru-viewer-web-release.tar.gz", "静态网页构建产物"),
          ]
          for platform, filename, description in downloads:
              url = f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              rows.append(f"| {platform} | [{filename}]({url}) | {description} |")
          Path(os.environ["RUNNER_TEMP"], "release_body.md").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PYTHON

      - name: Verify all seven release files exist
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          expected = [
              "android-release/danbooru-viewer-android-arm64-v8a.apk",
              "android-release/danbooru-viewer-android-armeabi-v7a.apk",
              "android-release/danbooru-viewer-android-x86_64.apk",
              "linux-release/danbooru-viewer-linux-release.tar.gz",
              "web-release/danbooru-viewer-web-release.tar.gz",
              "ios-release/app.ipa",
              "windows-release/danbooru-viewer-windows-release.zip",
          ]
          for name in expected:
              file = Path("artifacts", name)
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty release file: {name}")
          print("All seven platform files are present.")
          PYTHON

      - name: Create the exact release tag if needed
        if: needs.prepare.outputs.tag_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # POST is atomic and never moves an existing ref. A competing tag is
          # accepted only if the following read-only validation resolves it to
          # this exact SHA; permission/network errors with no tag fail closed.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA" \
              > "$RUNNER_TEMP/release-tag.json"; then
            echo "Tag creation was not completed; verifying any existing tag before continuing."
          fi

      - name: Recheck master CI, tag SHA and absence of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUIRE_TAG: "true"
        run: python scripts/prepare_release.py

      - name: Create Release without overwriting an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release_body.md" \
            artifacts/android-release/danbooru-viewer-android-arm64-v8a.apk \
            artifacts/android-release/danbooru-viewer-android-armeabi-v7a.apk \
            artifacts/android-release/danbooru-viewer-android-x86_64.apk \
            artifacts/linux-release/danbooru-viewer-linux-release.tar.gz \
            artifacts/web-release/danbooru-viewer-web-release.tar.gz \
            artifacts/ios-release/app.ipa \
            artifacts/windows-release/danbooru-viewer-windows-release.zip
